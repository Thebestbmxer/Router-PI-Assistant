{% extends "base.html" %}

{% block title %}
Router Pi Controller Setup
{% endblock %}


{% block content %}

<div class="welcome">

    <h1>Router Pi Controller</h1>

    <p id="message">
        Checking router status...
    </p>


    <div id="router-info"></div>


    <button id="search">
        Search Again
    </button>


    <button id="provision" disabled>
        Install SSH Key
    </button>


    <button id="continue" disabled>
        Proceed to Status Page
    </button>


</div>


<script>async function refreshStatus()
{
    const response =
        await fetch(
            "/api/router/welcome/status"
        );

    const status =
        await response.json();


    document.getElementById("message")
        .textContent =
            status.message;


    document.getElementById("router-info")
        .textContent =
            status.address
            ? "Router: "
              + status.address
              + ":"
              + status.ssh_port
            : "";


    document.getElementById("provision")
        .disabled =
            status.ready;


    document.getElementById("continue")
        .disabled =
            !status.ready;
}


document
.getElementById("search")
.addEventListener(
    "click",
    refreshStatus
);


document
.getElementById("provision")
.addEventListener(
    "click",
    async () => {

        await fetch(
            "/api/router/provision",
            {
                method:"POST"
            }
        );

        refreshStatus();
    }
);


refreshStatus();</script>

{% endblock %}
