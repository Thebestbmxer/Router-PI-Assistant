{% extends "base.html" %}

{% block content %}

<section class="status-page">
    <div class="page-heading">

        <div class="command">
            $ status
        </div>

        <h1> SYSTEM STATUS </h1>

        <p> Router Pi Assistant control interface </p>

    </div>

    <div class="status-grid">
        <section class="status-card">

            <div class="card-header">
                CONNECTION
            </div>

            <div class="status-row">

                <span>
                    SSH
                </span>

                <strong>
                    html_default
                </strong>

            </div>

            <div class="status-row">

                <span>
                    ROUTER
                </span>

                <strong>
                    html_default
                </strong>

            </div>

        </section>


        <section class="status-card">

            <div class="card-header">
                SYSTEM
            </div>

            <div class="status-row">

                <span>HOSTNAME</span>

                <strong id="router-hostname">Loading...</strong>
            </div>

            <div class="status-row">

                <span>
                    FIRMWARE
                </span>

                <strong>
                    Loading
                </strong>
            </div>
        </section>
    </div>

    <div class="terminal-line">
        <span>
            $ _
        </span>
    </div>
</section>
<script src="{{ url_for('static', filename='status/status.js') }}"></script>

{% endblock %}
