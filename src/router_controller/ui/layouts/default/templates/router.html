{% extends "base.html" %}

{% block content %}

<section class="status-page">
    <div class="page-heading">

        <div class="command">
            $ router
        </div>

        <h1> ROUTER SETTINGS </h1>

    </div>

    <div class="status-grid">
        <section class="status-card">

            <div class="card-header">
                Router Infomation
            </div>

            <div class="status-row">
                <span>
                    Local Time
                </span>
                <strong>
                    YYYY:MM:DD HH:MM:SS
                </strong>
            </div>

            <div class="status-row">
                <span>
                    Hostname
                </span>
                <strong>
                    html_default
                </strong>
            </div>

            <div class="status-row">
                <span>
                    FIRMWARE
                </span>

                <strong>
                    OpenWrt
                </strong>
            </div>

        </section>


        <section class="status-card">

            <div class="card-header">
                Router Display
            </div>

            <div class="status-row">
                <span>
                    Local Time
                </span>
                <strong>
                    YYYY:MM:DD HH:MM:SS
                </strong>
            </div>

            <div class="status-row">

                <span>HOSTNAME</span>

                <strong id="router-hostname">Loading...</strong>
            </div>

        </section>
    </div>

</section>
<script src="{{ url_for('static', filename='status/status.js') }}"></script>

{% endblock %}
